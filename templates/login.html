<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIFTY 50 — Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #131722; color: #d1d4dc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .card {
            background: #1e222d; border: 1px solid #2a2e39;
            border-radius: 8px; padding: 40px; width: 340px;
        }
        .title { font-size: 20px; font-weight: 600; margin-bottom: 6px; color: #fff; }
        .sub { font-size: 13px; color: #787b86; margin-bottom: 28px; }
        label { display: block; font-size: 12px; color: #787b86; margin-bottom: 6px; }
        input {
            width: 100%; padding: 10px 12px; background: #131722;
            border: 1px solid #2a2e39; border-radius: 4px;
            color: #d1d4dc; font-size: 14px; margin-bottom: 16px;
            outline: none;
        }
        input:focus { border-color: #2196f3; }
        button {
            width: 100%; padding: 10px; background: #2196f3;
            border: none; border-radius: 4px; color: #fff;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        button:hover { background: #1976d2; }
        .error {
            background: #2d1515; border: 1px solid #ef5350;
            color: #ef5350; padding: 10px 12px; border-radius: 4px;
            font-size: 13px; margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">NIFTY 50</div>
        <div class="sub">Supertrend Dashboard — Sign in to continue</div>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" autofocus autocomplete="off">
            <label>Password</label>
            <input type="password" name="password">
            <button type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
