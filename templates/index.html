<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIFTY 50 - Supertrend</title>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f1117; color: #e2e8f0; font-family: Segoe UI, sans-serif; }
        .header { padding: 10px 20px; background: #161b27; border-bottom: 1px solid #2d3748; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .header h1 { font-size: 18px; color: #f7c948; }
        .price { font-size: 22px; font-weight: bold; color: #4ade80; }
        .intervals { display: flex; gap: 6px; }
        .btn { padding: 5px 12px; border-radius: 5px; border: 1px solid #2d3748; background: #1e2535; color: #e2e8f0; cursor: pointer; font-size: 12px; }
        .btn.active { background: #f7c948; color: #0f1117; font-weight: bold; border-color: #f7c948; }
        .btn:hover { background: #2d3748; }
        .reset-btn { padding: 5px 12px; border-radius: 5px; border: 1px solid #2d3748; background: #1e2535; color: #e2e8f0; cursor: pointer; font-size: 13px; }
        .reset-btn:hover { background: #2d3748; }
        #chart { width: 100%; height: calc(100vh - 60px - 220px); }
        .positions-panel { background: #161b27; border-top: 1px solid #2d3748; padding: 8px 20px; height: 80px; overflow-y: auto; }
        .history-panel { background: #0f1117; border-top: 1px solid #2d3748; padding: 6px 20px; height: 140px; overflow-y: auto; }
        .panel-label { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .positions-panel table, .history-panel table { width: 100%; border-collapse: collapse; }
        .positions-panel th, .history-panel th { text-align: left; font-size: 11px; color: #94a3b8; padding: 3px 8px; border-bottom: 1px solid #2d3748; }
        .positions-panel td, .history-panel td { font-size: 12px; padding: 4px 8px; }
        .side-buy { color: #4ade80; font-weight: bold; }
        .side-sell { color: #f87171; font-weight: bold; }
        .pnl-profit { color: #4ade80; font-weight: bold; }
        .pnl-loss { color: #f87171; font-weight: bold; }
        .empty-row { color: #64748b; text-align: center; padding: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>NIFTY 50</h1>
        <span class="price" id="live-price">Loading...</span>
        <span id="market-status-badge" style="font-size: 11px; padding: 4px 10px; border-radius: 12px; background: #2d3748; color: #94a3b8;">checking...</span>
        <div class="intervals">
            <button class="btn" onclick="changeInterval(event,'5minute')">5m</button>
            <button class="btn active" onclick="changeInterval(event,'15minute')">15m</button>
            <button class="btn" onclick="changeInterval(event,'60minute')">1hr</button>
        </div>
        <button class="reset-btn" onclick="resetView()">Reset view</button>
    </div>
    <div id="chart"></div>
    <div class="positions-panel">
        <div class="panel-label">Open Position</div>
        <table>
            <thead>
                <tr><th>Side</th><th>Entry Price</th><th>Entry Time</th><th>Current Price</th><th>Spot P&L</th><th>Option</th><th>Option Premium</th><th>Option P&L</th><th>Status</th></tr>
            </thead>
            <tbody id="positions-body">
                <tr><td colspan="9" class="empty-row">No active position</td></tr>
            </tbody>
        </table>
    </div>
    <div class="history-panel">
        <div class="panel-label">Trade Log</div>
        <table>
            <thead>
                <tr><th>Entry Time</th><th>Side</th><th>Symbol</th><th>Entry Spot</th><th>Entry Prem</th><th>Exit Prem</th><th>Exit Time</th><th>Exit Reason</th><th>P&L (pts)</th><th>P&L (₹)</th></tr>
            </thead>
            <tbody id="history-body">
                <tr><td colspan="10" class="empty-row">No trades yet</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        let currentPrice = null;

        let lastTickDate = null;

        function formatAxisTick(time) {
            const d = new Date(time * 1000);
            const dayStr = d.toLocaleDateString("en-GB", { timeZone: "Asia/Kolkata", day: "2-digit", month: "short" });
            // Show the date on the first tick of each day, time otherwise
            const dateKey = d.toLocaleDateString("en-GB", { timeZone: "Asia/Kolkata" });
            if (dateKey !== lastTickDate) {
                lastTickDate = dateKey;
                return dayStr;
            }
            return d.toLocaleTimeString("en-GB", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit", hour12: false });
        }

        function formatHoverTime(time) {
            const d = new Date(time * 1000);
            const dateStr = d.toLocaleDateString("en-GB", { timeZone: "Asia/Kolkata", day: "2-digit", month: "short", year: "numeric" });
            const timeStr = d.toLocaleTimeString("en-GB", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit", hour12: false });
            return dateStr + " " + timeStr;
        }

        const HEADER_H = 60;
        const POSITIONS_H = 220;

        const chart = LightweightCharts.createChart(document.getElementById("chart"), {
            layout: { backgroundColor: "#0f1117", textColor: "#e2e8f0" },
            grid: { vertLines: { color: "#1e2535" }, horzLines: { color: "#1e2535" } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            timeScale: {
                borderColor: "#2d3748",
                timeVisible: true,
                secondsVisible: false,
                tickMarkFormatter: (time) => formatAxisTick(time)
            },
            localization: {
                timeFormatter: (time) => formatHoverTime(time)
            },
            width: document.getElementById("chart").clientWidth,
            height: window.innerHeight - HEADER_H - POSITIONS_H,
        });

        const candleSeries = chart.addCandlestickSeries({
            upColor: "#4ade80", downColor: "#f87171",
            borderUpColor: "#4ade80", borderDownColor: "#f87171",
            wickUpColor: "#4ade80", wickDownColor: "#f87171",
        });

        const supertrendSeries = chart.addLineSeries({
            color: "#a78bfa", lineWidth: 2, title: "Supertrend",
        });

        const socket = io();

        function updateMarketStatus() {
            fetch("/api/market_status")
                .then(r => r.json())
                .then(d => {
                    const badge = document.getElementById("market-status-badge");
                    badge.textContent = d.is_open ? "● MARKET OPEN" : "○ " + d.status.toUpperCase();
                    badge.style.background = d.is_open ? "#14532d" : "#2d3748";
                    badge.style.color = d.is_open ? "#4ade80" : "#94a3b8";
                });
        }
        updateMarketStatus();
        setInterval(updateMarketStatus, 60000);

        function resetView() {
            chart.timeScale().resetTimeScale();
            chart.timeScale().scrollToRealTime();
        }

        function changeInterval(e, interval) {
            document.querySelectorAll(".intervals .btn").forEach(b => b.classList.remove("active"));
            e.target.classList.add("active");
            currentIntervalSeconds = INTERVAL_SECONDS[interval] || 900;
            currentIntervalName = interval;
            shouldResetView = true;
            socket.emit("change_interval", { interval: interval });
        }

        socket.on("historical_data", (data) => {
            if (!data || data.length === 0) return;

            candleSeries.setData(data);
            const stData = data.filter(d => d.supertrend !== null).map(d => ({ time: d.time, value: d.supertrend }));
            supertrendSeries.setData(stData);

            const markers = [];
            data.forEach(d => {
                if (d.signal === "BUY") {
                    markers.push({ time: d.time, position: "belowBar", color: "#4ade80", shape: "arrowUp", text: "BUY" });
                } else if (d.signal === "SELL") {
                    markers.push({ time: d.time, position: "aboveBar", color: "#f87171", shape: "arrowDown", text: "SELL" });
                }
            });
            candleSeries.setMarkers(markers);

            const last = data[data.length - 1];
            currentPrice = last.close;
            lastCandle = { time: last.time, open: last.open, high: last.high, low: last.low, close: last.close };
            document.getElementById("live-price").textContent = last.close.toLocaleString();

            // Find the most recent signal and open a position from it
            const signalCandles = data.filter(d => d.signal);
            if (signalCandles.length > 0) {
                const lastSignal = signalCandles[signalCandles.length - 1];
                const t = new Date(lastSignal.time * 1000).toLocaleString();
                openPosition(lastSignal.signal, lastSignal.close, t);
            }
            renderPosition();

            if (shouldResetView) {
                resetView();
                shouldResetView = false;
            }
        });

        let lastCandle = null;
        let activePosition = null;  // { side, entry, entryTime }
        let currentIntervalSeconds = 900;  // 15min default, updated on interval change
        let currentIntervalName = "15minute";
        let shouldResetView = true;  // reset on first load and on explicit interval change

        const INTERVAL_SECONDS = { "5minute": 300, "15minute": 900, "60minute": 3600 };

        function getCandleBucket(unixTime) {
            return Math.floor(unixTime / currentIntervalSeconds) * currentIntervalSeconds;
        }

        let optionSymbol = null;
        let optionEntryPremium = null;
        let optionCurrentPremium = null;

        function renderPosition() {
            const body = document.getElementById("positions-body");
            if (!activePosition) {
                body.innerHTML = '<tr><td colspan="9" class="empty-row">No active position</td></tr>';
                return;
            }
            const cur = currentPrice || activePosition.entry;
            const pnl = activePosition.side === "BUY" ? (cur - activePosition.entry) : (activePosition.entry - cur);
            const pnlClass = pnl >= 0 ? "pnl-profit" : "pnl-loss";
            const sideClass = activePosition.side === "BUY" ? "side-buy" : "side-sell";

            let optPnlCell = "--";
            let optPremCell = "--";
            let optSymCell = optionSymbol || "--";
            if (optionEntryPremium !== null && optionCurrentPremium !== null) {
                const optPnl = optionCurrentPremium - optionEntryPremium;  // long option always: current - entry
                const optClass = optPnl >= 0 ? "pnl-profit" : "pnl-loss";
                optPnlCell = `<span class="${optClass}">${optPnl >= 0 ? "+" : ""}${optPnl.toFixed(2)} pts</span>`;
                optPremCell = `${optionEntryPremium.toFixed(2)} -> ${optionCurrentPremium.toFixed(2)}`;
            }

            body.innerHTML = `<tr>
                <td class="${sideClass}">${activePosition.side}</td>
                <td>${activePosition.entry.toLocaleString()}</td>
                <td>${activePosition.entryTime}</td>
                <td>${cur.toLocaleString()}</td>
                <td class="${pnlClass}">${pnl >= 0 ? "+" : ""}${pnl.toFixed(2)} pts</td>
                <td>${optSymCell}</td>
                <td>${optPremCell}</td>
                <td>${optPnlCell}</td>
                <td>OPEN (real premium)</td>
            </tr>`;
        }

        socket.on("live_option_price", (data) => {
            if (data.symbol !== optionSymbol) {
                // new option contract started tracking - reset entry premium
                optionSymbol = data.symbol;
                optionEntryPremium = data.price;
            }
            optionCurrentPremium = data.price;
            renderPosition();
        });

        function openPosition(side, price, time) {
            activePosition = { side: side, entry: price, entryTime: time };
            renderPosition();
        }


        socket.on("live_price", (data) => {
            currentPrice = data.price;
            document.getElementById("live-price").textContent = data.price.toLocaleString();
            renderPosition();
        });

        socket.on("trade_history", (trades) => {
            const body = document.getElementById("history-body");
            if (!trades || trades.length === 0) {
                body.innerHTML = '<tr><td colspan="10" class="empty-row">No trades yet</td></tr>';
                return;
            }
            body.innerHTML = trades.map(t => {
                const sideClass = t.side === "BUY" ? "side-buy" : "side-sell";
                const pnlClass = t.pnl_points >= 0 ? "pnl-profit" : "pnl-loss";
                const pnlPts = t.pnl_points != null ? `<span class="${pnlClass}">${t.pnl_points >= 0 ? "+" : ""}${t.pnl_points.toFixed(2)}</span>` : "--";
                const pnlInr = t.pnl_rupees != null ? `<span class="${pnlClass}">${t.pnl_rupees >= 0 ? "+" : ""}${t.pnl_rupees.toLocaleString("en-IN", {maximumFractionDigits: 0})}</span>` : "--";
                const exitPrem = t.exit_premium != null ? t.exit_premium.toFixed(2) : "--";
                const exitTime = t.exit_time || "--";
                const exitReason = t.exit_reason || (t.status === "OPEN" ? "<b>OPEN</b>" : "--");
                return `<tr>
                    <td>${t.entry_time}</td>
                    <td class="${sideClass}">${t.side}</td>
                    <td>${t.symbol}</td>
                    <td>${t.entry_spot.toLocaleString()}</td>
                    <td>${t.entry_premium.toFixed(2)}</td>
                    <td>${exitPrem}</td>
                    <td>${exitTime}</td>
                    <td>${exitReason}</td>
                    <td>${pnlPts}</td>
                    <td>${pnlInr}</td>
                </tr>`;
            }).join("");
        });

        window.addEventListener("resize", () => {
            chart.resize(document.getElementById("chart").clientWidth, window.innerHeight - HEADER_H - POSITIONS_H);
        });
    </script>
</body>
</html>
